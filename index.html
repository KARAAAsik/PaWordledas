<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вордли — Классическая Игра</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div id="game-container">
        <header>
            <h1>PaWordle</h1>
            <p class="subtitle">Отгадайте слово из 5 букв за 6 попыток</p>
        </header>
        <div id="board"></div>
        <div id="message-container" class="hidden"></div>
        <div id="keyboard"></div>
        
        <!-- Кнопку вернули внутрь контейнера игры -->
        <button class="reset-btn" onclick="window.location.reload();">Начать сначала</button>
    </div>

    <script src="script.js"></script>
</body>
</html>
